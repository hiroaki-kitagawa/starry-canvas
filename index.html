<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starry Canvas — 星育成</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Zen+Maru+Gothic:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- 画面全体: ヘッダー / 夜空ステージ / 操作パネル -->
    <div class="app">
      <header class="header">
        <p class="brand">Starry Canvas</p>
        <p class="tagline">背景をドラッグして星を探し、育てよう</p>
      </header>

      <main class="stage-wrap">
        <!-- 視点（ビューポート）。内部の world をドラッグでパンする -->
        <div id="sky" class="sky" aria-label="夜空ステージ" role="application">
          <div class="zoom-controls" aria-label="拡大縮小コントロール">
            <button id="zoomOut" class="zoom-controls__btn" type="button" aria-label="縮小">−</button>
            <label class="zoom-controls__field" aria-label="拡大率を入力">
              <input
                id="zoomInput"
                class="zoom-controls__input"
                type="number"
                min="10"
                max="150"
                step="0.1"
                inputmode="numeric"
                aria-label="拡大率（パーセント）"
              />
              <span class="zoom-controls__suffix">%</span>
            </label>
            <button id="zoomIn" class="zoom-controls__btn" type="button" aria-label="拡大">＋</button>
            <span id="zoomLevel" class="zoom-controls__level" aria-live="polite">100%</span>
          </div>
          <div id="world" class="world">
            <div class="world-bg" aria-hidden="true"></div>
            <div id="stars" class="stars"></div>
          </div>
          <!-- パーティクルは視点固定で描画する -->
          <canvas id="particles" class="particles" aria-hidden="true"></canvas>
          <div id="telescope" class="telescope" hidden aria-hidden="true">
            <div class="telescope__scope" aria-hidden="true">
              <div id="telescopeStar" class="telescope__star"></div>
              <img id="telescopeImage" class="telescope__image" alt="" />
            </div>
          </div>
        </div>
      </main>

      <footer class="panel">
        <div class="panel-info">
          <p id="selectionLabel" class="selection-label">星を選んでください</p>
          <!-- 育成進捗（バー / ％ / 残り時間） -->
          <div class="progress-row">
            <div
              class="progress-track"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
              id="progressTrack"
            >
              <div id="progressFill" class="progress-fill"></div>
            </div>
            <span id="progressPercent" class="progress-percent">0%</span>
            <span id="remainingTime" class="remaining-time">残り —</span>
          </div>
          <!-- マイルストーン・応援などの短文ログ -->
          <div class="growth-log" aria-live="polite" aria-relevant="additions">
            <p class="growth-log-title">成長ログ</p>
            <ul id="growthLog" class="growth-log-list"></ul>
          </div>
        </div>
        <button id="growBtn" class="grow-btn" type="button" disabled>育成</button>
      </footer>

      <!-- 完成時に短時間表示する祝福メッセージ -->
      <div id="celebrateBanner" class="celebrate-banner" hidden>
        <p class="celebrate-text">完成！</p>
      </div>

      <!-- 完成済みキャラクターをクリックしたときの詳細ポップアップ -->
      <div id="characterPopup" class="character-popup" hidden aria-hidden="true">
        <div class="character-popup__backdrop" data-popup-close="true"></div>
        <section
          class="character-popup__card"
          role="dialog"
          aria-modal="true"
          aria-labelledby="characterPopupTitle"
          aria-describedby="characterPopupMessage"
        >
          <button
            id="characterPopupClose"
            class="character-popup__close"
            type="button"
            aria-label="ポップアップを閉じる"
          >
            ×
          </button>
          <img id="characterPopupImage" class="character-popup__image" alt="" />
          <p id="characterPopupTitle" class="character-popup__title"></p>
          <p id="characterPopupMessage" class="character-popup__message"></p>
        </section>
      </div>

      <!-- 全ての星を育て終えたときのお祝いポップアップ -->
      <div id="completionPopup" class="completion-popup" hidden aria-hidden="true">
        <div class="completion-popup__backdrop" data-popup-close="true"></div>
        <section
          class="completion-popup__card"
          role="dialog"
          aria-modal="true"
          aria-labelledby="completionPopupTitle"
          aria-describedby="completionPopupMessage"
        >
          <button
            id="completionPopupClose"
            class="completion-popup__close"
            type="button"
            aria-label="ポップアップを閉じる"
          >
            ×
          </button>
          <p id="completionPopupTitle" class="completion-popup__title"></p>
          <p id="completionPopupMessage" class="completion-popup__message"></p>
        </section>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
