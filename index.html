<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starry Canvas — 星育成</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Zen+Maru+Gothic:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <p class="brand">Starry Canvas</p>
        <p class="tagline">夜空の星を育てて、キャラクターにしよう</p>
      </header>

      <main class="stage-wrap">
        <div id="sky" class="sky" aria-label="夜空ステージ" role="application">
          <div class="sky-dust" aria-hidden="true"></div>
          <div id="stars" class="stars"></div>
          <canvas id="particles" class="particles" aria-hidden="true"></canvas>
        </div>
      </main>

      <footer class="panel">
        <div class="panel-info">
          <p id="selectionLabel" class="selection-label">星を選んでください</p>
          <div class="progress-row">
            <div
              class="progress-track"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
              id="progressTrack"
            >
              <div id="progressFill" class="progress-fill"></div>
            </div>
            <span id="progressPercent" class="progress-percent">0%</span>
            <span id="remainingTime" class="remaining-time">残り —</span>
          </div>
        </div>
        <button id="growBtn" class="grow-btn" type="button" disabled>育成</button>
      </footer>

      <div id="celebrateBanner" class="celebrate-banner" hidden>
        <p class="celebrate-text">完成！</p>
      </div>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
